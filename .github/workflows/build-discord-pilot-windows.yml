name: Construire et tester DiscordPilot.exe sur Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-discord-pilot-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Télécharger les sources de la version
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.4.1/DiscordPilot_Source.zip' -OutFile 'sources.zip'
          Expand-Archive -LiteralPath 'sources.zip' -DestinationPath 'buildsrc'
          if (-not (Test-Path 'buildsrc/discord-pilot/windows_entrypoint.py')) { throw 'Entrée Windows introuvable' }

      - name: Conserver les correctifs existants de la version 0.4.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.4.2/DiscordPilot_Source.zip' -OutFile 'sources-042.zip'
          Expand-Archive -LiteralPath 'sources-042.zip' -DestinationPath 'patchsrc'
          $overlays = @('app.py', 'planner.py', 'discord_ops.py', 'storage.py', 'updater.py', 'updater_cli.py', 'version.json', 'requirements.txt', 'README.md', 'web/index.html', 'web/app.js', 'web/style.css', 'web/updates.css', 'demarrer.ps1', 'DEMARRER_DISCORD_PILOT.cmd', 'LANCER_DISCORD_PILOT.bat', 'CONSTRUIRE_EXE_WINDOWS.bat')
          foreach ($relative in $overlays) {
            $source = Join-Path 'patchsrc/discord-pilot' $relative
            $destination = Join-Path 'buildsrc/discord-pilot' $relative
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $destination -Force }
          }

      - name: Appliquer le planificateur long format et les modules existants 0.5.19
        shell: pwsh
        run: |
          Copy-Item 'discord-pilot/app.py' 'buildsrc/discord-pilot/app.py' -Force
          Copy-Item 'discord-pilot/planner.py' 'buildsrc/discord-pilot/planner.py' -Force
          Copy-Item 'discord-pilot/long_requests.py' 'buildsrc/discord-pilot/long_requests.py' -Force
          Copy-Item 'discord-pilot/plan_runtime.py' 'buildsrc/discord-pilot/plan_runtime.py' -Force
          Copy-Item 'discord-pilot/panel_actions.py' 'buildsrc/discord-pilot/panel_actions.py' -Force
          Copy-Item 'discord-pilot/panel_planning.py' 'buildsrc/discord-pilot/panel_planning.py' -Force
          Copy-Item 'discord-pilot/conversational_workflows.py' 'buildsrc/discord-pilot/conversational_workflows.py' -Force
          Copy-Item 'discord-pilot/discord_diagnostics.py' 'buildsrc/discord-pilot/discord_diagnostics.py' -Force
          Copy-Item 'discord-pilot/integration_catalog.py' 'buildsrc/discord-pilot/integration_catalog.py' -Force
          Copy-Item 'discord-pilot/community_modules.py' 'buildsrc/discord-pilot/community_modules.py' -Force
          Copy-Item 'discord-pilot/community_interactions.py' 'buildsrc/discord-pilot/community_interactions.py' -Force
          Copy-Item 'discord-pilot/community_support.py' 'buildsrc/discord-pilot/community_support.py' -Force
          Copy-Item 'discord-pilot/discord_ops.py' 'buildsrc/discord-pilot/discord_ops.py' -Force
          Copy-Item 'discord-pilot/storage.py' 'buildsrc/discord-pilot/storage.py' -Force
          Copy-Item 'discord-pilot/updater.py' 'buildsrc/discord-pilot/updater.py' -Force
          Copy-Item 'discord-pilot/README.md' 'buildsrc/discord-pilot/README.md' -Force
          Copy-Item 'discord-pilot/requirements.txt' 'buildsrc/discord-pilot/requirements.txt' -Force
          Copy-Item 'discord-pilot/web/index.html' 'buildsrc/discord-pilot/web/index.html' -Force
          Copy-Item 'discord-pilot/web/app.js' 'buildsrc/discord-pilot/web/app.js' -Force
          Copy-Item 'discord-pilot/web/updates.css' 'buildsrc/discord-pilot/web/updates.css' -Force
          Copy-Item 'discord-pilot/tests/test_api.py' 'buildsrc/discord-pilot/tests/test_api.py' -Force
          Copy-Item 'discord-pilot/tests/test_voice_webm.py' 'buildsrc/discord-pilot/tests/test_voice_webm.py' -Force
          Copy-Item 'discord-pilot/tests/test_natural_language.py' 'buildsrc/discord-pilot/tests/test_natural_language.py' -Force
          Copy-Item 'discord-pilot/tests/test_p2_planner.py' 'buildsrc/discord-pilot/tests/test_p2_planner.py' -Force
          Copy-Item 'discord-pilot/tests/test_p3_panels.py' 'buildsrc/discord-pilot/tests/test_p3_panels.py' -Force
          Copy-Item 'discord-pilot/tests/test_p4_workflows.py' 'buildsrc/discord-pilot/tests/test_p4_workflows.py' -Force
          Copy-Item 'discord-pilot/tests/test_executor.py' 'buildsrc/discord-pilot/tests/test_executor.py' -Force
          Copy-Item 'discord-pilot/tests/test_prompt_preparer.py' 'buildsrc/discord-pilot/tests/test_prompt_preparer.py' -Force
          Copy-Item 'discord-pilot/tests/test_long_requests.py' 'buildsrc/discord-pilot/tests/test_long_requests.py' -Force
          Copy-Item 'discord-pilot/tests/test_automations.py' 'buildsrc/discord-pilot/tests/test_automations.py' -Force
          Copy-Item 'discord-pilot/tests/test_integrations.py' 'buildsrc/discord-pilot/tests/test_integrations.py' -Force
          Copy-Item 'discord-pilot/tests/test_community_modules.py' 'buildsrc/discord-pilot/tests/test_community_modules.py' -Force
          Copy-Item 'discord-pilot/tests/test_interactive.py' 'buildsrc/discord-pilot/tests/test_interactive.py' -Force
          Copy-Item 'discord-pilot/version.json' 'buildsrc/discord-pilot/version.json' -Force
          Copy-Item 'discord-pilot/frozen_updater.ps1' 'buildsrc/discord-pilot/frozen_updater.ps1' -Force
          Copy-Item 'discord-pilot/demarrer.ps1' 'buildsrc/discord-pilot/demarrer.ps1' -Force
          Copy-Item 'discord-pilot/tests/test_frontend_update.cjs' 'buildsrc/discord-pilot/tests/test_frontend_update.cjs' -Force

      - name: Installer les dépendances et exécuter les tests
        working-directory: buildsrc/discord-pilot
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m unittest discover -s tests -q
          node --check web/app.js
          node tests/test_frontend_update.cjs

      - name: Construire un exécutable unique
        working-directory: buildsrc/discord-pilot
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DiscordPilot --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all huggingface_hub --collect-all av --collect-all tzdata --add-data "web;web" --add-data "version.json;." --add-data "frozen_updater.ps1;." windows_entrypoint.py

      - name: Démarrer et tester l'EXE réel sous Windows
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'buildsrc/discord-pilot/dist/DiscordPilot.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'EXE absent après compilation' }
          $env:DISCORD_PILOT_NO_BROWSER = '1'
          $env:LOCALAPPDATA = Join-Path $PWD 'test-discord-pilot-state'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath $exe -PassThru
          $ready = $false
          try {
            for ($n = 0; $n -lt 60; $n++) {
              Start-Sleep -Seconds 2
              try {
                $data = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/bootstrap' -TimeoutSec 2
                if ($data.version -eq '0.5.19' -and $data.online -eq $false) { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { throw "Le programme s'est arrêté trop tôt : $($p.ExitCode)" }
            }
            if (-not $ready) { throw 'Le serveur local ne demarre pas en 120 secondes.' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -TimeoutSec 10
            $asset = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/assets/app.js' -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $asset.StatusCode -ne 200) { throw 'Interface locale incomplète.' }
            if ($page.Content -notmatch 'voiceButton') { throw 'Bouton microphone absent de l interface Windows.' }
            if ($page.Content -notmatch 'voicePreview') { throw 'Lecteur de verification des vocaux absent.' }
            # Validate the complete 8-second WAV payload, from Opera conversion
            # through HTTP and the Whisper model in the actual compiled EXE.
            $wavPath = Join-Path $PWD 'test-voice-silence.wav'
            $pcm = New-Object byte[] (16000 * 2 * 8)
            for ($i = 0; $i -lt (16000 * 8); $i++) { $pcm[$i * 2] = 0; $pcm[$i * 2 + 1] = 16 }
            $stream = [System.IO.File]::Create($wavPath)
            try {
              $writer = [System.IO.BinaryWriter]::new($stream)
              $writer.Write([System.Text.Encoding]::ASCII.GetBytes('RIFF'))
              $writer.Write([int](36 + $pcm.Length))
              $writer.Write([System.Text.Encoding]::ASCII.GetBytes('WAVEfmt '))
              $writer.Write([int]16); $writer.Write([int16]1); $writer.Write([int16]1)
              $writer.Write([int]16000); $writer.Write([int]32000)
              $writer.Write([int16]2); $writer.Write([int16]16)
              $writer.Write([System.Text.Encoding]::ASCII.GetBytes('data'))
              $writer.Write([int]$pcm.Length)
              $writer.Write($pcm)
              $writer.Flush()
            } finally { $stream.Dispose() }
            $speech = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/transcribe' -Method POST -ContentType 'audio/wav' -Headers @{'X-Pilot-CSRF'=$data.csrf} -InFile $wavPath -TimeoutSec 600
            if ($speech.language -ne 'fr-FR' -or -not $speech.local -or $speech.engine -ne 'whisper-small' -or $speech.seconds -lt 7.9 -or $speech.seconds -gt 8.1) { throw 'Le moteur vocal local a tronque le WAV de huit secondes dans l EXE.' }
            $prompt = @{guild_id='1567347687379050727';mode='auto';prompt='Je veux creer deux salons bienvenue et au revoir'} | ConvertTo-Json
            $draft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($prompt)) -TimeoutSec 90
            if ($draft.plan.status -ne 'draft' -or $draft.plan.actions.Count -ne 2 -or $draft.plan.actions[0].type -ne 'create_text_channel' -or $draft.plan.actions[0].name -ne 'bienvenue' -or $draft.plan.actions[1].name -ne 'au revoir') { throw 'Le planificateur n a pas compris une demande en francais de deux salons.' }
            $complex = @{guild_id='1567347687379050727';mode='auto';prompt="Je veux que tu crees un salon. Bienvenue, au revoir et invitation. Le salon bienvenu est deja cree. Quand une personne arrive, un message dans bienvenu. Quand quelqu un quitte, dans au revoir. Pour invitation, si un utilisateur invite sa premiere personne, puis son onzieme personne, annonce le nombre."} | ConvertTo-Json
            $automations = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($complex)) -TimeoutSec 90
            $types = @($automations.plan.actions | ForEach-Object { $_.type })
            if ($automations.plan.status -ne 'draft' -or $types.Count -ne 5 -or $types[0] -ne 'create_text_channel' -or $types[1] -ne 'create_text_channel' -or $types[2] -ne 'configure_welcome' -or $types[3] -ne 'configure_farewell' -or $types[4] -ne 'configure_invites') { throw 'Les automatisations bienvenue, depart et invitation ne sont pas toutes dans le plan.' }
            $native = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/modules/1567347687379050727' -TimeoutSec 10
            if ($native.modules.Count -ne 17 -or $native.online -or $page.Content -notmatch 'modulesTab' -or $page.Content -notmatch 'issueWarning') { throw 'Les dix-sept modules natifs ne sont pas visibles ou leur etat hors ligne est incorrect.' }
            if ($null -eq $native.invite_leaderboard -or $null -eq $native.activity_leaderboard -or $null -eq $native.warnings) { throw 'Les tableaux de bord activite, invitations et avertissements sont incomplets.' }
            $offlineWarning = @{member_id='123456789012345678';reason='Test manuel'} | ConvertTo-Json
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/community/1567347687379050727/warn' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($offlineWarning)) -ErrorAction Stop
              throw 'Un avertissement a ete cree alors que le bot est hors ligne.'
            } catch {
              if ($_.Exception.Message -like 'Un avertissement*') { throw }
            }
            $interactive = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/interactive/1567347687379050727' -TimeoutSec 10
            if ($null -eq $interactive.events -or $null -eq $interactive.tickets -or $null -eq $interactive.applications -or $page.Content -notmatch 'pollForm' -or $page.Content -notmatch 'giveawayForm' -or $page.Content -notmatch 'quizForm') { throw 'L interface des tickets, quiz, candidatures, sondages et giveaways est absente.' }
            $offlineEvent = @{channel_id='223456789012345678';minutes=1;prize='Test'} | ConvertTo-Json
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/interactive/1567347687379050727/giveaway' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($offlineEvent)) -ErrorAction Stop
              throw 'Un giveaway a ete publie alors que le bot est hors ligne.'
            } catch {
              if ($_.Exception.Message -like 'Un giveaway*') { throw }
            }
            $nativePrompt = @{guild_id='1567347687379050727';mode='auto';prompt="Active l'XP"} | ConvertTo-Json
            $nativeDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($nativePrompt)) -TimeoutSec 90
            if ($nativeDraft.plan.status -ne 'draft' -or $nativeDraft.plan.actions[0].type -ne 'set_module' -or $nativeDraft.plan.actions[0].module -ne 'xp') { throw 'La demande native XP ne cree pas de plan.' }
            $statsPrompt = @{guild_id='1567347687379050727';mode='auto';prompt='Active les statistiques des messages'} | ConvertTo-Json
            $statsDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($statsPrompt)) -TimeoutSec 90
            if ($statsDraft.plan.status -ne 'draft' -or $statsDraft.plan.actions.Count -ne 1 -or $statsDraft.plan.actions[0].module -ne 'activity_stats') { throw 'La demande de statistiques est restee sans action alors que le module natif existe.' }
            $rolesPrompt = @{guild_id='1567347687379050727';mode='auto';prompt='Gere les roles des salons que tu viens de creer'} | ConvertTo-Json
            $rolesDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($rolesPrompt)) -TimeoutSec 90
            if ($rolesDraft.configuration_required -ne 'channel_role_access' -or $page.Content -notmatch 'configureChannelRoles') { throw 'La demande de permissions ne propose pas le formulaire guide.' }
            $restrictPrompt = @{guild_id='1567347687379050727';mode='local';prompt='Modifie les rôles pour les salons au revoir, bienvenue, invitation pour pas que tout le monde puisse écrire dedans'} | ConvertTo-Json
            $restrictDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($restrictPrompt)) -TimeoutSec 15
            if ($restrictDraft.plan.status -ne 'draft' -or $restrictDraft.plan.actions.Count -ne 3 -or (@($restrictDraft.plan.actions | Where-Object { $_.type -eq 'lock_channel_writing' }).Count -ne 3) -or -not $restrictDraft.plan.interpretation) { throw 'Le preparateur n a pas compris la mise en lecture seule de trois salons.' }
            $vaguePrompt = @{guild_id='1567347687379050727';mode='local';prompt='Arrange le serveur a ta convenance'} | ConvertTo-Json
            $vagueResult = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($vaguePrompt)) -TimeoutSec 10
            if (-not $vagueResult.needs_clarification -or -not $vagueResult.question -or -not $vagueResult.examples) { throw 'La demande sans action ne propose pas de clarification editable.' }
            $compoundPrompt = @{guild_id='1567347687379050727';mode='local';prompt='Cree un salon archives et active les statistiques des messages'} | ConvertTo-Json
            $compoundDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($compoundPrompt)) -TimeoutSec 10
            if ($compoundDraft.plan.status -ne 'draft' -or $compoundDraft.plan.actions.Count -ne 2 -or $compoundDraft.plan.actions[0].type -ne 'create_text_channel' -or $compoundDraft.plan.actions[1].type -ne 'set_module') { throw 'Une demande comportant deux actions connues doit conserver les deux dans le brouillon.' }
            $rightsPrompt = @{guild_id='1567347687379050727';mode='local';prompt='Autorise le rôle Membre à voir le salon annonces'} | ConvertTo-Json
            $rightsDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($rightsPrompt)) -TimeoutSec 10
            if ($rightsDraft.plan.status -ne 'draft' -or $rightsDraft.plan.actions.Count -ne 1 -or $rightsDraft.plan.actions[0].type -ne 'set_role_access' -or $rightsDraft.plan.actions[0].view -ne 'allow' -or $rightsDraft.plan.actions[0].role -ne 'Membre') { throw 'Les permissions explicites par nom ne sont pas planifiees par le vrai EXE.' }
            $panelPrompt = @{guild_id='1567347687379050727';mode='local';prompt='Publie le panneau des tickets'} | ConvertTo-Json
            $panelDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($panelPrompt)) -TimeoutSec 10
            if ($panelDraft.plan.status -ne 'draft' -or $panelDraft.plan.actions.Count -ne 1 -or $panelDraft.plan.actions[0].type -ne 'publish_ticket_panel') { throw 'Le vrai EXE ne prepare pas le panneau des tickets depuis une demande naturelle.' }
            $fullRequest = @{guild_id='1567347687379050727';mode='local';prompt='Crée une catégorie SUPPORT et un salon tickets dans la catégorie SUPPORT et un rôle Support puis active les tickets et publie le panneau des tickets'} | ConvertTo-Json
            $fullDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($fullRequest)) -TimeoutSec 10
            if ($fullDraft.plan.status -ne 'draft' -or $fullDraft.plan.actions.Count -ne 5 -or $fullDraft.plan.actions[3].type -ne 'configure_module' -or $fullDraft.plan.actions[4].type -ne 'publish_ticket_panel') { throw 'Le vrai EXE ne planifie pas tout le parcours tickets dans une demande naturelle.' }
            $spec = @('Rôles:')
            for ($role = 0; $role -lt 32; $role++) { $spec += "- VXK Role $role" }
            for ($category = 0; $category -lt 11; $category++) {
              $spec += "CATÉGORIE : VXK Pole $category"
              $spec += 'Salons:'
              $count = 6 + [int]($category -lt 7)
              for ($channel = 0; $channel -lt $count; $channel++) { $spec += "- #salon-$category-$channel" }
            }
            $specPrompt = $spec -join "`n"
            $specPrompt += ' ' * (50000 - $specPrompt.Length)
            if ($specPrompt.Length -ne 50000) { throw 'La requete longue de test n a pas exactement 50 000 caracteres.' }
            $largeRequest = @{guild_id='1567347687379050727';mode='local';prompt=$specPrompt} | ConvertTo-Json -Compress
            $largeDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($largeRequest)) -TimeoutSec 20
            if ($largeDraft.plan.status -ne 'draft' -or $largeDraft.plan.actions.Count -ne 116) { throw 'Le vrai EXE ne comprend pas la specification VXK de 32 roles, 11 categories et 73 salons.' }
            $tooLargeRequest = @{guild_id='1567347687379050727';mode='local';prompt=($specPrompt + 'X')} | ConvertTo-Json -Compress
            $tooLargeResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($tooLargeRequest)) -SkipHttpErrorCheck -TimeoutSec 20
            if ([int]$tooLargeResponse.StatusCode -ne 400) { throw 'Le vrai EXE accepte plus de 50 000 caracteres.' }
            if ($page.Content -notmatch 'maxlength="50000"') { throw 'Le formulaire Windows conserve une ancienne limite de caracteres.' }
            if ($page.Content -notmatch 'testDiscordButton') { throw 'Le bouton de diagnostic Discord est absent de la version Windows.' }
            $liveRequest = @{guild_id='1567347687379050727';mode='active'} | ConvertTo-Json
            $liveResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/live-test' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($liveRequest)) -SkipHttpErrorCheck -TimeoutSec 10
            if ([int]$liveResponse.StatusCode -ne 400 -or $liveResponse.Content -notmatch 'Bot non') { throw 'Le diagnostic doit refuser un test actif sans bot connecte.' }
            $catalogue = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/catalog' -TimeoutSec 10
            if ($catalogue.features.Count -ne 90 -or -not $catalogue.providers.jockie.url -or $page.Content -notmatch 'catalogTab') { throw 'Le catalogue des integrations est absent du vrai EXE Windows.' }
            $musicPrompt = @{guild_id='1567347687379050727';mode='auto';prompt='Ajoute un bot musical, des tickets, une protection antiraid et des niveaux'} | ConvertTo-Json
            $musicDraft = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/plan' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body ([System.Text.Encoding]::UTF8.GetBytes($musicPrompt)) -TimeoutSec 90
            $integrations = @($musicDraft.plan.actions | ForEach-Object { $_.provider })
            if ($musicDraft.plan.status -ne 'draft' -or $integrations.Count -ne 4 -or 'jockie' -notin $integrations -or 'tickettool' -notin $integrations -or 'wick' -notin $integrations -or 'lyx' -notin $integrations) { throw 'Les demandes multiples d integration ne sont pas comprises.' }
            $planUrl = "http://127.0.0.1:8765/api/execute/$($musicDraft.plan.id)"
            $accept = Invoke-RestMethod -Uri $planUrl -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$data.csrf} -Body '{}' -TimeoutSec 10
            if (-not $accept.ok) { throw 'La preparation des liens externes a echoue.' }
            $approval = $false
            for ($attempt=0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 250
              $history = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/history/1567347687379050727' -TimeoutSec 10
              $entry = @($history.plans | Where-Object { $_.id -eq $musicDraft.plan.id })[0]
              if ($entry.status -eq 'authorization_required') {
                $approval = (@($entry.results | Where-Object { $_.status -eq 'authorization_required' -and $_.authorization_url -like 'https://*' }).Count -eq 4)
                break
              }
            }
            if (-not $approval) { throw 'Installation tierce incorrectement annoncee comme terminee sans OAuth Discord.' }
            Write-Host 'INTEGRATIONS WINDOWS OK : 90 fiches, 4 bots, aucune installation fictive.'
            Write-Host 'MODULES WINDOWS OK : 17 modules natifs, recompenses XP/invitations, statistiques et avertissements manuels ; aucune activation hors ligne.'
            Write-Host 'AUTOMATISATIONS WINDOWS OK : deux salons, trois regles, sans execution Discord prematuree.'
            Write-Host 'PLANIFICATEUR WINDOWS OK : demande naturelle, deux salons et brouillon sans precisions.'
            Write-Host 'PLANIFICATEUR 50K WINDOWS OK : 116 operations VXK en brouillon, limite stricte, aucune mutation Discord.'
            Write-Host 'SMOKE TEST WINDOWS OK : EXE, serveur, Whisper Small, WAV complet de huit secondes, lecture et interface.'
          } finally {
            try { & taskkill.exe /T /F /PID $p.Id *> $null } catch {}
          }

      - name: Tester le lancement avec le port 8765 occupe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'buildsrc/discord-pilot/dist/DiscordPilot.exe'
          $env:DISCORD_PILOT_NO_BROWSER = '1'
          $env:LOCALAPPDATA = Join-Path $PWD 'test-port-occupied-state'
          $env:DISCORD_PILOT_PORT = '9215'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 9215)
          $listener.Start()
          $p = $null
          try {
            $p = Start-Process -FilePath $exe -PassThru
            $ready = $false
            for ($n = 0; $n -lt 60; $n++) {
              Start-Sleep -Seconds 2
              try {
                $data = Invoke-RestMethod -Uri 'http://127.0.0.1:9216/api/bootstrap' -TimeoutSec 2
                if ($data.version -eq '0.5.19' -and $data.online -eq $false) { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { throw "Le programme s'est arrete malgre le port alternatif : $($p.ExitCode)" }
            }
            if (-not $ready) { throw 'Le port 9216 ne repond pas apres lancement.' }
            Write-Host 'REGRESSION WINDOWS OK : port 9215 occupe, app fonctionnelle sur 9216.'
          } finally {
            if ($p) { try { & taskkill.exe /T /F /PID $p.Id *> $null } catch {} }
            $listener.Stop()
          }

      - name: Tester relance PyInstaller onefile avec environnement reinitialise
        shell: pwsh
        run: |
          # The EXE launches its own powershell.exe 5.1 helper, regardless of
          # the PowerShell 7 shell used by the GitHub Actions test.
          # Isolate the installed EXE and user state from the build directory.
          $installed = Join-Path $PWD 'update-e2e/DiscordPilot.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $installed -Parent) | Out-Null
          Copy-Item 'buildsrc/discord-pilot/dist/DiscordPilot.exe' $installed -Force
          $env:DISCORD_PILOT_NO_BROWSER = '1'
          $env:DISCORD_PILOT_PORT = '9337'
          $env:LOCALAPPDATA = Join-Path $PWD 'test-auto-restart-state'
          $dataRoot = Join-Path $env:LOCALAPPDATA 'DiscordPilot'
          $updates = Join-Path $dataRoot 'updates'
          New-Item -ItemType Directory -Force -Path $updates | Out-Null
          $p = Start-Process -FilePath $installed -PassThru
          $ready = $false
          try {
            for ($n = 0; $n -lt 60; $n++) {
              Start-Sleep -Seconds 2
              try {
                $boot = Invoke-RestMethod -Uri 'http://127.0.0.1:9337/api/bootstrap' -TimeoutSec 2
                if ($boot.version -eq '0.5.19') { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { throw 'L EXE s est arrete avant de preparer la mise a jour.' }
            }
            if (-not $ready) { throw 'EXE initial introuvable sur son port.' }

            # Same-version payload exercises the real Windows replacement and
            # restart without needing to build an unpublishable second binary.
            Copy-Item $installed (Join-Path $updates 'pending.exe') -Force
            $hash = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash.ToLowerInvariant()
            $pending = @{version='0.5.19';sha256=$hash;format='exe'} | ConvertTo-Json
            [System.IO.File]::WriteAllText((Join-Path $updates 'pending.json'), $pending)
            $response = Invoke-RestMethod -Uri 'http://127.0.0.1:9337/api/update/apply' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$boot.csrf} -Body '{}'
            if (-not $response.restarting) { throw 'Le serveur n a pas accepte le redemarrage.' }

            $restarted = $false
            for ($n = 0; $n -lt 65; $n++) {
              Start-Sleep -Seconds 1
              try {
                $boot2 = Invoke-RestMethod -Uri 'http://127.0.0.1:9337/api/bootstrap' -TimeoutSec 2
                $logPath = Join-Path $dataRoot 'updater.log'
                if ($boot2.version -eq '0.5.19' -and
                    -not (Test-Path (Join-Path $updates 'pending.json')) -and
                    (Test-Path $logPath) -and
                    (Select-String -Path $logPath -Pattern 'Version 0.5.19 installee et ouverte' -Quiet)) {
                  $restarted = $true
                  break
                }
              } catch {}
              $logPath = Join-Path $dataRoot 'updater.log'
              $startupError = Join-Path $dataRoot 'startup-error.log'
              if (Test-Path $startupError) {
                Get-Content $startupError
                throw 'Le nouvel EXE a echoue pendant l extraction PyInstaller.'
              }
              if ((Test-Path $logPath) -and
                  (Select-String -Path $logPath -Pattern 'ERREUR :' -Quiet)) {
                Get-Content $logPath
                throw 'L outil de mise a jour a signale une erreur pendant son execution.'
              }
            }
            if (-not $restarted) {
              if (Test-Path (Join-Path $dataRoot 'updater.log')) {
                Get-Content (Join-Path $dataRoot 'updater.log')
              }
              foreach ($probePort in @(9337,9338,9339,9340)) {
                try {
                  $probe = Invoke-RestMethod -Uri "http://127.0.0.1:$probePort/api/bootstrap" -TimeoutSec 2
                  Write-Host "Diagnostic port $probePort : version $($probe.version)"
                } catch { Write-Host "Diagnostic port $probePort : aucune reponse" }
              }
              netstat -ano | Select-String -Pattern ':933[7-9]|:9340'
              throw 'Le bouton de mise a jour n a pas remplace et redemarre l EXE automatiquement.'
            }
            if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw 'Le programme installe apres redemarrage n est pas verifie.'
            }
            Write-Host 'TEST E2E WINDOWS OK : copie, remplacement, relancement, reponse HTTP, port conserve.'
          } finally {
            $line = netstat -ano | Select-String -Pattern ':9337\s+.*LISTENING\s+(\d+)' | Select-Object -First 1
            if ($line) {
              $listenerPid = [int]$line.Matches[0].Groups[1].Value
              try { & taskkill.exe /T /F /PID $listenerPid *> $null } catch {}
            }
            try { & taskkill.exe /T /F /PID $p.Id *> $null } catch {}
            # The original PID has normally exited already after a successful
            # update. Ignore taskkill's exit code without masking test errors.
            $global:LASTEXITCODE = 0
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordPilot_EXE_Windows_v0.5.19
          path: buildsrc/discord-pilot/dist/DiscordPilot.exe
          if-no-files-found: error

      - name: Publier la version 0.5.19 après les tests Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Resolve-Path 'buildsrc/discord-pilot/dist/DiscordPilot.exe').Path
          $sourceRoot = Join-Path $PWD 'source-clean/discord-pilot'
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          $allowed = @('app.py', 'planner.py', 'long_requests.py', 'plan_runtime.py', 'panel_actions.py', 'panel_planning.py', 'conversational_workflows.py', 'discord_diagnostics.py', 'integration_catalog.py', 'community_modules.py', 'community_interactions.py', 'community_support.py', 'storage.py', 'discord_ops.py', 'updater.py', 'updater_cli.py', 'requirements.txt', 'version.json', 'README.md', 'web/index.html', 'web/app.js', 'web/style.css', 'web/updates.css', 'LANCER_DISCORD_PILOT.bat', 'DEMARRER_DISCORD_PILOT.cmd', 'demarrer.ps1', 'CONSTRUIRE_EXE_WINDOWS.bat')
          foreach ($relative in $allowed) {
            $destination = Join-Path $sourceRoot $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
            Copy-Item -LiteralPath (Join-Path 'buildsrc/discord-pilot' $relative) -Destination $destination -Force
          }
          Compress-Archive -Path 'source-clean/discord-pilot' -DestinationPath 'DiscordPilot_Source.zip'
          $archive = (Resolve-Path 'DiscordPilot_Source.zip').Path
          $notes = 'Discord Pilot 0.5.19 : demandes jusqu a 50 000 caracteres, analyse par sections pour Ollama, plans jusqu a 200 actions et specifications de roles/categories/salons sans IA. Protection contre plans partiels et suppressions non demandees. Tests Python, frontend et executable Windows avant publication. Mise a jour par le bouton MAJ sans reinstallation.'
          $tag = 'v0.5.19'
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $archive --clobber
          } else {
            gh release create $tag $exe $archive --title 'Discord Pilot 0.5.19' --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'La publication de la release a échoué.' }

          $exeSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveSha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = '0.5.19'
            url = 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.5.19/DiscordPilot_Source.zip'
            sha256 = $archiveSha
            exe_url = 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.5.19/DiscordPilot.exe'
            exe_sha256 = $exeSha
          }
          $json = ConvertTo-Json -InputObject $manifest -Depth 3
          [System.IO.File]::WriteAllText((Join-Path $PWD 'update.json'), $json + "`n", (New-Object System.Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'chore: publier le manifeste 0.5.19'
          if ($LASTEXITCODE -ne 0) { throw 'Le manifeste de mise à jour n a pas pu être enregistré.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Le manifeste de mise à jour n a pas pu être publié.' }
