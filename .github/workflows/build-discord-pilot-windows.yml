name: Construire et tester DiscordPilot.exe sur Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-discord-pilot-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Télécharger les sources de la version
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.4.1/DiscordPilot_Source.zip' -OutFile 'sources.zip'
          Expand-Archive -LiteralPath 'sources.zip' -DestinationPath 'buildsrc'
          if (-not (Test-Path 'buildsrc/discord-pilot/windows_entrypoint.py')) { throw 'Entrée Windows introuvable' }

      - name: Conserver les correctifs existants de la version 0.4.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.4.2/DiscordPilot_Source.zip' -OutFile 'sources-042.zip'
          Expand-Archive -LiteralPath 'sources-042.zip' -DestinationPath 'patchsrc'
          $overlays = @('app.py', 'planner.py', 'discord_ops.py', 'storage.py', 'updater.py', 'updater_cli.py', 'version.json', 'requirements.txt', 'README.md', 'web/index.html', 'web/app.js', 'web/style.css', 'web/updates.css', 'demarrer.ps1', 'DEMARRER_DISCORD_PILOT.cmd', 'LANCER_DISCORD_PILOT.bat', 'CONSTRUIRE_EXE_WINDOWS.bat')
          foreach ($relative in $overlays) {
            $source = Join-Path 'patchsrc/discord-pilot' $relative
            $destination = Join-Path 'buildsrc/discord-pilot' $relative
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $destination -Force }
          }

      - name: Appliquer les correctifs 0.4.4 et le nouvel outil de redemarrage
        shell: pwsh
        run: |
          Copy-Item 'discord-pilot/app.py' 'buildsrc/discord-pilot/app.py' -Force
          Copy-Item 'discord-pilot/planner.py' 'buildsrc/discord-pilot/planner.py' -Force
          Copy-Item 'discord-pilot/web/app.js' 'buildsrc/discord-pilot/web/app.js' -Force
          Copy-Item 'discord-pilot/tests/test_api.py' 'buildsrc/discord-pilot/tests/test_api.py' -Force
          Copy-Item 'discord-pilot/tests/test_natural_language.py' 'buildsrc/discord-pilot/tests/test_natural_language.py' -Force
          Copy-Item 'discord-pilot/version.json' 'buildsrc/discord-pilot/version.json' -Force
          Copy-Item 'discord-pilot/frozen_updater.ps1' 'buildsrc/discord-pilot/frozen_updater.ps1' -Force

      - name: Installer les dépendances et exécuter les tests
        working-directory: buildsrc/discord-pilot
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m unittest discover -s tests -q

      - name: Construire un exécutable unique
        working-directory: buildsrc/discord-pilot
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DiscordPilot --add-data "web;web" --add-data "version.json;." --add-data "frozen_updater.ps1;." windows_entrypoint.py

      - name: Démarrer et tester l'EXE réel sous Windows
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'buildsrc/discord-pilot/dist/DiscordPilot.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'EXE absent après compilation' }
          $env:DISCORD_PILOT_NO_BROWSER = '1'
          $env:LOCALAPPDATA = Join-Path $PWD 'test-discord-pilot-state'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath $exe -PassThru
          $ready = $false
          try {
            for ($n = 0; $n -lt 60; $n++) {
              Start-Sleep -Seconds 2
              try {
                $data = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/bootstrap' -TimeoutSec 2
                if ($data.version -eq '0.4.4' -and $data.online -eq $false) { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { throw "Le programme s'est arrêté trop tôt : $($p.ExitCode)" }
            }
            if (-not $ready) { throw 'Le serveur local ne demarre pas en 120 secondes.' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -TimeoutSec 10
            $asset = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/assets/app.js' -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $asset.StatusCode -ne 200) { throw 'Interface locale incomplète.' }
            Write-Host 'SMOKE TEST WINDOWS OK : EXE, serveur HTTP, interface et JavaScript disponibles.'
          } finally {
            try { & taskkill.exe /T /F /PID $p.Id *> $null } catch {}
          }

      - name: Tester le lancement avec le port 8765 occupe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'buildsrc/discord-pilot/dist/DiscordPilot.exe'
          $env:DISCORD_PILOT_NO_BROWSER = '1'
          $env:LOCALAPPDATA = Join-Path $PWD 'test-port-occupied-state'
          $env:DISCORD_PILOT_PORT = '9215'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 9215)
          $listener.Start()
          $p = $null
          try {
            $p = Start-Process -FilePath $exe -PassThru
            $ready = $false
            for ($n = 0; $n -lt 60; $n++) {
              Start-Sleep -Seconds 2
              try {
                $data = Invoke-RestMethod -Uri 'http://127.0.0.1:9216/api/bootstrap' -TimeoutSec 2
                if ($data.version -eq '0.4.4' -and $data.online -eq $false) { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { throw "Le programme s'est arrete malgre le port alternatif : $($p.ExitCode)" }
            }
            if (-not $ready) { throw 'Le port 9216 ne repond pas apres lancement.' }
            Write-Host 'REGRESSION WINDOWS OK : port 9215 occupe, app fonctionnelle sur 9216.'
          } finally {
            if ($p) { try { & taskkill.exe /T /F /PID $p.Id *> $null } catch {} }
            $listener.Stop()
          }

      - name: Tester installation et redemarrage automatique avec PowerShell Windows 5.1
        shell: pwsh
        run: |
          # The EXE launches its own powershell.exe 5.1 helper, regardless of
          # the PowerShell 7 shell used by the GitHub Actions test.
          # Isolate the installed EXE and user state from the build directory.
          $installed = Join-Path $PWD 'update-e2e/DiscordPilot.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $installed -Parent) | Out-Null
          Copy-Item 'buildsrc/discord-pilot/dist/DiscordPilot.exe' $installed -Force
          $env:DISCORD_PILOT_NO_BROWSER = '1'
          $env:DISCORD_PILOT_PORT = '9337'
          $env:LOCALAPPDATA = Join-Path $PWD 'test-auto-restart-state'
          $dataRoot = Join-Path $env:LOCALAPPDATA 'DiscordPilot'
          $updates = Join-Path $dataRoot 'updates'
          New-Item -ItemType Directory -Force -Path $updates | Out-Null
          $p = Start-Process -FilePath $installed -PassThru
          $ready = $false
          try {
            for ($n = 0; $n -lt 60; $n++) {
              Start-Sleep -Seconds 2
              try {
                $boot = Invoke-RestMethod -Uri 'http://127.0.0.1:9337/api/bootstrap' -TimeoutSec 2
                if ($boot.version -eq '0.4.4') { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { throw 'L EXE s est arrete avant de preparer la mise a jour.' }
            }
            if (-not $ready) { throw 'EXE initial introuvable sur son port.' }

            # Same-version payload exercises the real Windows replacement and
            # restart without needing to build an unpublishable second binary.
            Copy-Item $installed (Join-Path $updates 'pending.exe') -Force
            $hash = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash.ToLowerInvariant()
            $pending = @{version='0.4.4';sha256=$hash;format='exe'} | ConvertTo-Json
            [System.IO.File]::WriteAllText((Join-Path $updates 'pending.json'), $pending)
            $response = Invoke-RestMethod -Uri 'http://127.0.0.1:9337/api/update/apply' -Method POST -ContentType 'application/json' -Headers @{'X-Pilot-CSRF'=$boot.csrf} -Body '{}'
            if (-not $response.restarting) { throw 'Le serveur n a pas accepte le redemarrage.' }

            $restarted = $false
            for ($n = 0; $n -lt 65; $n++) {
              Start-Sleep -Seconds 1
              try {
                $boot2 = Invoke-RestMethod -Uri 'http://127.0.0.1:9337/api/bootstrap' -TimeoutSec 2
                $logPath = Join-Path $dataRoot 'updater.log'
                if ($boot2.version -eq '0.4.4' -and
                    -not (Test-Path (Join-Path $updates 'pending.json')) -and
                    (Test-Path $logPath) -and
                    (Select-String -Path $logPath -Pattern 'Version 0.4.4 installee et ouverte' -Quiet)) {
                  $restarted = $true
                  break
                }
              } catch {}
              $logPath = Join-Path $dataRoot 'updater.log'
              if ((Test-Path $logPath) -and
                  (Select-String -Path $logPath -Pattern 'ERREUR :' -Quiet)) {
                Get-Content $logPath
                throw 'L outil de mise a jour a signale une erreur pendant son execution.'
              }
            }
            if (-not $restarted) {
              if (Test-Path (Join-Path $dataRoot 'updater.log')) {
                Get-Content (Join-Path $dataRoot 'updater.log')
              }
              foreach ($probePort in @(9337,9338,9339,9340)) {
                try {
                  $probe = Invoke-RestMethod -Uri "http://127.0.0.1:$probePort/api/bootstrap" -TimeoutSec 2
                  Write-Host "Diagnostic port $probePort : version $($probe.version)"
                } catch { Write-Host "Diagnostic port $probePort : aucune reponse" }
              }
              netstat -ano | Select-String -Pattern ':933[7-9]|:9340'
              throw 'Le bouton de mise a jour n a pas remplace et redemarre l EXE automatiquement.'
            }
            if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw 'Le programme installe apres redemarrage n est pas verifie.'
            }
            Write-Host 'TEST E2E WINDOWS OK : copie, remplacement, relancement, reponse HTTP, port conserve.'
          } finally {
            $line = netstat -ano | Select-String -Pattern ':9337\s+.*LISTENING\s+(\d+)' | Select-Object -First 1
            if ($line) {
              $listenerPid = [int]$line.Matches[0].Groups[1].Value
              try { & taskkill.exe /T /F /PID $listenerPid *> $null } catch {}
            }
            try { & taskkill.exe /T /F /PID $p.Id *> $null } catch {}
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordPilot_EXE_Windows_v0.4.4
          path: buildsrc/discord-pilot/dist/DiscordPilot.exe
          if-no-files-found: error

      - name: Publier la version 0.4.4 après les tests Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Resolve-Path 'buildsrc/discord-pilot/dist/DiscordPilot.exe').Path
          $sourceRoot = Join-Path $PWD 'source-clean/discord-pilot'
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          $allowed = @('app.py', 'planner.py', 'storage.py', 'discord_ops.py', 'updater.py', 'updater_cli.py', 'requirements.txt', 'version.json', 'README.md', 'web/index.html', 'web/app.js', 'web/style.css', 'web/updates.css', 'LANCER_DISCORD_PILOT.bat', 'DEMARRER_DISCORD_PILOT.cmd', 'demarrer.ps1', 'CONSTRUIRE_EXE_WINDOWS.bat')
          foreach ($relative in $allowed) {
            $destination = Join-Path $sourceRoot $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
            Copy-Item -LiteralPath (Join-Path 'buildsrc/discord-pilot' $relative) -Destination $destination -Force
          }
          Compress-Archive -Path 'source-clean/discord-pilot' -DestinationPath 'DiscordPilot_Source.zip'
          $archive = (Resolve-Path 'DiscordPilot_Source.zip').Path
          $notes = 'Redemarrage automatique apres mise a jour : le programme est relance sur le meme port et la page deja ouverte se recharge des que la nouvelle version repond. Les erreurs de lancement restent visibles sans quitter brutalement. Tests de mise a jour et de relancement reels sur Windows.'
          $tag = 'v0.4.4'
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $archive --clobber
          } else {
            gh release create $tag $exe $archive --title 'Discord Pilot 0.4.4' --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'La publication de la release a échoué.' }

          $exeSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $archiveSha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = '0.4.4'
            url = 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.4.4/DiscordPilot_Source.zip'
            sha256 = $archiveSha
            exe_url = 'https://github.com/brekwu/discord-pilot-updates/releases/download/v0.4.4/DiscordPilot.exe'
            exe_sha256 = $exeSha
          }
          $json = ConvertTo-Json -InputObject $manifest -Depth 3
          [System.IO.File]::WriteAllText((Join-Path $PWD 'update.json'), $json + "`n", (New-Object System.Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'chore: publier le manifeste 0.4.4'
          if ($LASTEXITCODE -ne 0) { throw 'Le manifeste de mise à jour n a pas pu être enregistré.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Le manifeste de mise à jour n a pas pu être publié.' }
