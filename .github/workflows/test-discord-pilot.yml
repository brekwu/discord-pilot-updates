name: Tests Discord Pilot (avant fusion)
on:
  pull_request:
    paths:
      - 'discord-pilot/**'
      - '.github/workflows/test-discord-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        working-directory: discord-pilot
        run: python -m pip install -r requirements.txt
      - name: Tester le code, les scenarios et l interface
        working-directory: discord-pilot
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -q
          node --check web/app.js
          node tests/test_frontend_update.cjs
